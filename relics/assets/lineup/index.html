<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soccer Pixel Art Gallery</title>
  <meta name="description" content="A gallery of soccer pixel art assets.">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 1100px); margin: 0 auto; padding: 3rem 0 5rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 5vw, 3.5rem); }
    .intro { color: #cbd5e1; margin: 0 0 2rem; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
    .card { margin: 0; overflow: hidden; border: 1px solid #334155; border-radius: 16px; background: #1e293b; }
    .art { display: grid; place-items: center; min-height: 220px; padding: 2rem; background: #f8fafc; }
    img { display: block; width: min(100%, 220px); height: 160px; object-fit: contain; image-rendering: pixelated; }
    figcaption { padding: 1rem 1.25rem; font-size: 1.1rem; font-weight: 650; }
    @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <h1>Soccer Pixel Art Gallery</h1>
    <p class="intro">34 soccer assets from the lineup library.</p>
    <div class="grid">
      <figure class="card"><div class="art"><img src="./icon-assist.svg" alt="Assist" loading="lazy"></div><figcaption>Assist</figcaption></figure>
      <figure class="card"><div class="art"><img src="./icon-goal.svg" alt="Goal" loading="lazy"></div><figcaption>Goal</figcaption></figure>
      <figure class="card"><div class="art"><img src="./icon-sub.svg" alt="Sub" loading="lazy"></div><figcaption>Sub</figcaption></figure>
      <figure class="card"><div class="art"><img src="./icon-whistle.svg" alt="Whistle" loading="lazy"></div><figcaption>Whistle</figcaption></figure>
      <figure class="card"><div class="art"><img src="./react-ball.svg" alt="Ball" loading="lazy"></div><figcaption>Ball</figcaption></figure>
      <figure class="card"><div class="art"><img src="./react-clap.svg" alt="Clap" loading="lazy"></div><figcaption>Clap</figcaption></figure>
      <figure class="card"><div class="art"><img src="./react-fire.svg" alt="Fire" loading="lazy"></div><figcaption>Fire</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-chip.svg" alt="Chip" loading="lazy"></div><figcaption>Chip</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-counter-attack.svg" alt="Counter Attack" loading="lazy"></div><figcaption>Counter Attack</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-deflected.svg" alt="Deflected" loading="lazy"></div><figcaption>Deflected</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-dribbled-the-keeper.svg" alt="Dribbled The Keeper" loading="lazy"></div><figcaption>Dribbled The Keeper</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-far-post.svg" alt="Far Post" loading="lazy"></div><figcaption>Far Post</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-free-kick.svg" alt="Free Kick" loading="lazy"></div><figcaption>Free Kick</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-from-corner.svg" alt="From Corner" loading="lazy"></div><figcaption>From Corner</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-from-goal-kick.svg" alt="From Goal Kick" loading="lazy"></div><figcaption>From Goal Kick</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-from-throw-in.svg" alt="From Throw In" loading="lazy"></div><figcaption>From Throw In</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-half-volley.svg" alt="Half Volley" loading="lazy"></div><figcaption>Half Volley</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-header.svg" alt="Header" loading="lazy"></div><figcaption>Header</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-high.svg" alt="High" loading="lazy"></div><figcaption>High</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-left-foot.svg" alt="Left Foot" loading="lazy"></div><figcaption>Left Foot</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-long-shot.svg" alt="Long Shot" loading="lazy"></div><figcaption>Long Shot</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-low.svg" alt="Low" loading="lazy"></div><figcaption>Low</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-mid.svg" alt="Mid" loading="lazy"></div><figcaption>Mid</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-near-post.svg" alt="Near Post" loading="lazy"></div><figcaption>Near Post</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-off-the-post-bar.svg" alt="Off The Post Bar" loading="lazy"></div><figcaption>Off The Post Bar</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-one-on-one.svg" alt="One On One" loading="lazy"></div><figcaption>One On One</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-open-play.svg" alt="Open Play" loading="lazy"></div><figcaption>Open Play</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-penalty.svg" alt="Penalty" loading="lazy"></div><figcaption>Penalty</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-rebound.svg" alt="Rebound" loading="lazy"></div><figcaption>Rebound</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-right-foot.svg" alt="Right Foot" loading="lazy"></div><figcaption>Right Foot</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-scramble.svg" alt="Scramble" loading="lazy"></div><figcaption>Scramble</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-through-the-legs.svg" alt="Through The Legs" loading="lazy"></div><figcaption>Through The Legs</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-top-bin.svg" alt="Top Bin" loading="lazy"></div><figcaption>Top Bin</figcaption></figure>
      <figure class="card"><div class="art"><img src="./shot-volley.svg" alt="Volley" loading="lazy"></div><figcaption>Volley</figcaption></figure>
    </div>
  </main>
</body>
</html>
