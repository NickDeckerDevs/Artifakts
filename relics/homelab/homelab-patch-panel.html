{"id": "C5", "name": "Converter to gateway", "area": "Inside rack", "color": "red", "state": "Existing", "device": "Q1000K · installer jack", "wall": "Inside rack", "plate": "No wall plate", "switch": "Hostess", "socket": "Red ONT/LAN", "panel": null, "note": "Keep installer connection behind equipment. No panel or brush detour."}, {"id": "C6", "name": "Expo to Runner", "area": "Inside rack", "color": "black", "state": "Existing", "device": "Expo · Ethernet 7", "wall": "Inside rack", "plate": "No wall plate", "switch": "Runner", "socket": null, "panel": null, "note": "Direct front jumper. Runner uplink socket not identified."}], "version": "routing-workbench-2", "placement": "Proposal", "colors": {"blue": "Your office", "yellow": "Family room", "orange": "Guest / Child bedrooms", "white": "Master / unidentified", "black": "Rack equipment / NVR", "red": "Internet connection"}}</script><script>
const data=JSON.parse(document.querySelector('#data').textContent),rows=data.connections;
const colors={blue:'#2d70bd',yellow:'#e8bd37',orange:'#d87932',white:'#f3f1e7',black:'#30352f',red:'#b94739'};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=rows[0],batch=5,filter='all';
function state(r){return r.state==='Planned'?'P · planned':r.state==='Unknown'?'? · unknown':'Existing';}
function list(){let last='';$('#list').innerHTML=rows.filter(r=>filter==='all'||r.state===filter).map(r=>{const group=r.area!==last?'<div class="list-group">'+esc(r.area)+'</div>':'';last=r.area;return group+'<button class="connection" data-id="'+r.id+'" aria-current="'+(r.id===current.id)+'" style="--c:'+colors[r.color]+'"><span class="dot"></span><span><b>'+esc(r.name)+'</b><small>'+r.id+'</small></span>'+(r.state==='Existing'?'':'<span class="status-pill '+r.state.toLowerCase()+'">'+(r.state==='Planned'?'P':'?')+'</span>')+'</button>';}).join('');}
$('#choose').innerHTML=rows.map(r=>'<option value="'+r.id+'">'+esc(r.name)+' · '+state(r)+'</option>').join('');
function switchSocket(x,y,n,sw,r,w=25){const selected=r.switch===sw&&r.socket==='Ethernet '+n;return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="17" rx="1" fill="'+(selected?colors[r.color]:'#424b40')+'" stroke="'+(selected?'#d7f29d':'#788473')+'"/><text x="'+(x+w/2)+'" y="'+(y+12)+'" text-anchor="middle" font-size="11" fill="#fff">'+n+'</text>';}

 s+='<rect x="6" y="4" width="748" height="54" fill="#30382e" stroke="#586351"/><path d="M423 4 V58" stroke="#75826c"/><text x="20" y="34" fill="#b6beb1" font-size="13">EXPO</text><path d="M110 31 H390" stroke="#485241"/>';
 for(let i=0;i<4;i++){s+=switchSocket(454+i*39,10,2+i*2,'Expo',r,29)+switchSocket(454+i*39,34,1+i*2,'Expo',r,29);}
 for(let i=0;i<2;i++){const selected=r.switch==='Expo'&&r.socket==='SFP+ '+(i+1);s+='<rect x="633" y="'+(9+i*25)+'" width="77" height="19" fill="'+(selected?colors[r.color]:'#424b40')+'" stroke="#788473"/><text x="671" y="'+(23+i*25)+'" fill="white" text-anchor="middle" font-size="11">SFP+ '+(i+1)+'</text>';}
 s+='<rect x="6" y="77" width="748" height="49" fill="#171d17" stroke="#586351"/>';
 for(let n=1;n<=24;n++){const x=21+(n-1)*30.1,y=n%2?99:82;const assigned=rows.find(a=>a.panel===n),selected=r.panel===n;s+='<rect x="'+x+'" y="'+y+'" width="23" height="18" fill="'+(assigned?colors[assigned.color]:'#394136')+'" stroke="'+(selected?'#d3f887':'#687060')+'" stroke-width="'+(selected?3:1)+'"/><text x="'+(x+11.5)+'" y="'+(y+13)+'" fill="'+(assigned&&assigned.color==='white'?'#222':'white')+'" text-anchor="middle" font-size="11" class="mono">'+n+'</text>';}
 s+='<path d="M6 171 H164 M600 171 H754" stroke="#586351"/><rect x="164" y="147" width="436" height="49" fill="#30382e" stroke="#586351"/><text x="180" y="175" fill="#b6beb1" font-size="13">RUNNER</text>';

 if(r.panel&&r.socket?.startsWith('Ethernet ')){let n=Number(r.socket.split(' ')[1]),x=21+(r.panel-1)*30.1+11.5;let dx=454+(Math.ceil(n/2)-1)*39+14.5,dy=n%2?51:27;let sy=r.panel%2?99:82;const d='M'+x+' '+sy+' V67 H'+dx+' V'+dy;s+='<path d="'+d+'" stroke="#171d17" stroke-width="7" fill="none"/><path data-route d="'+d+'" stroke="'+colors[r.color]+'" stroke-width="3" stroke-linejoin="round" fill="none"/><circle cx="'+dx+'" cy="'+dy+'" r="3" fill="#d3f887"/>';}
 s+='</svg>';$('#rack').innerHTML=s;}
function renderJacks(){const first=batch*4+1;$('#range').textContent='Floor Plan '+first+'–'+(first+3);$('#position-state').textContent=current.panel?'Selected: '+current.panel:'Position unassigned';$('#prev').disabled=batch===0;$('#next').disabled=batch===5;$('#jacks').innerHTML=Array.from({length:4},(_,i)=>{const n=first+i,r=rows.find(x=>x.panel===n);return '<button '+(!r?'disabled ':'')+'class="jack '+(n%2?'odd ':'')+(current.panel===n?'selected':'')+'" data-jack="'+n+'" aria-label="Panel socket '+n+(r?', proposed '+esc(r.name):', unassigned')+'" style="--c:'+(r?colors[r.color]:'#b9beaf')+'"><span class="plug"></span><b>'+n+'</b><small>'+(r?'proposed':'free')+'</small></button>';}).join('');}

 $('#steps').innerHTML=steps;$('#evidence').textContent=r.panel?'Panel '+r.panel+' is proposed. Wall-jack left/right is still unknown.':'No panel socket assigned to this connection.';
 if(r.area==='Inside rack')$('#evidence').textContent='No patch-panel socket needed for this direct rack cable.';
 $('#record').innerHTML='<p><b>Connection ID:</b> '+esc(r.id)+' · stays with this connection when panel positions change.</p><p>'+esc(r.note)+'</p><p><b>Status:</b> '+state(r)+'. Existing describes the recorded setup, not a new live test.</p><p>Runner: two rows of eight sockets. Hardware revision and number order still need matching to your unit. <a href="https://static.tp-link.com/upload/manual/2025/202509/20250907/7100001129_TL-SG1016DE_IG.pdf">Manufacturer diagram</a>.</p>';
 $('#catalog').innerHTML=rows.map(a=>'<div class="catalog-row"><span class="runid">'+a.id+'</span><button data-id="'+a.id+'">'+esc(a.name)+'<br><small>'+esc(a.panel?'Panel '+a.panel+' · '+a.switch+' '+a.socket:a.area==='Inside rack'?'Direct cable':'Panel unassigned')+'</small></button><span>'+state(a)+'</span></div>').join('');list();}
function select(id){const r=rows.find(a=>a.id===id);if(!r)return;current=r;if(r.panel)batch=Math.floor((r.panel-1)/4);else batch=0;history.replaceState(null,'','#'+id);render();}
function view(index){document.body.classList.toggle('catalog-mode',index);$('#bench-view').setAttribute('aria-pressed',!index);$('#list-view').setAttribute('aria-pressed',index);}
$('#choose').onchange=e=>{view(false);select(e.target.value);};document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){view(false);select(b.dataset.id);}const j=e.target.closest('[data-jack]');if(j){const r=rows.find(a=>a.panel===Number(j.dataset.jack));if(r)select(r.id);else{$('#position-state').textContent='Socket '+j.dataset.jack+' · unassigned';document.querySelectorAll('.jack').forEach(el=>el.classList.toggle('selected',el===j));}}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.setAttribute('aria-pressed',el===f));list();}});
$('#prev').onclick=()=>{batch=Math.max(0,batch-1);renderJacks();};$('#next').onclick=()=>{batch=Math.min(5,batch+1);renderJacks();};$('#bench-view').onclick=()=>view(false);$('#list-view').onclick=()=>view(true);
const legacy={P13:'OF-W1',P14:'OF-W2',P15:'OF-S1',P16:'OF-S2'};function fromHash(){const id=decodeURIComponent(location.hash.slice(1));select(legacy[id]||id||rows[0].id);}window.addEventListener('hashchange',fromHash);fromHash();if(!$('#name').textContent)select(rows[0].id);
